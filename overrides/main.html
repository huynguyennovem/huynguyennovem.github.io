{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
{% if page and page.is_homepage %}
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ config.site_name }}" />
<meta property="og:site_name" content="{{ config.site_name }}" />
<meta property="og:description" content="{{ config.site_description }}" />
<meta property="og:url" content="{{ config.site_url }}" />
<meta property="og:image" content="{{ config.extra.social_image }}" />
<meta property="og:image:secure_url" content="{{ config.extra.social_image }}" />
<meta property="og:image:type" content="{{ config.extra.social_image_type }}" />
<meta property="og:image:width" content="{{ config.extra.social_image_width }}" />
<meta property="og:image:height" content="{{ config.extra.social_image_height }}" />
<meta property="og:image:alt" content="Portrait of Huy Nguyen" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ config.site_name }}" />
<meta name="twitter:description" content="{{ config.site_description }}" />
<meta name="twitter:image" content="{{ config.extra.social_image }}" />
<meta name="twitter:image:alt" content="Portrait of Huy Nguyen" />
{% endif %}
{#- Load Google Analytics only after first user interaction to keep lab/LCP clean #}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  function loadGtag() {
    if (window.__gtagLoaded) return;
    window.__gtagLoaded = true;
    var s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-RJT4VPTE10';
    s.async = true;
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', 'G-RJT4VPTE10', { anonymize_ip: true });
  }
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (evt) {
    window.addEventListener(evt, loadGtag, { once: true, passive: true });
  });
  // Fallback for users who never interact
  if ('requestIdleCallback' in window) {
    requestIdleCallback(function () { setTimeout(loadGtag, 5000); }, { timeout: 10000 });
  } else {
    window.addEventListener('load', function () { setTimeout(loadGtag, 8000); });
  }
</script>
{% endblock %}
